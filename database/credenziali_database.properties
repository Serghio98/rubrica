# Dati di accesso al server MySQL usato dalla Rubrica.
# Sostituire i valori con quelli del proprio MySQL prima di avviare Rubrica.jar;
# questo file deve stare nella stessa cartella di Rubrica.jar.
# Nota: nei file .properties il carattere \ va scritto \\ (anche nella password).

username=root
password=
ip-server-mysql=localhost
porta=3306

# Facoltativo: nome del database creato da schema_database.sql (predefinito: rubrica)
# database=rubrica
